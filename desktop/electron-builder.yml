# Installers: macOS .dmg, Linux .deb, Windows NSIS .exe. Unsigned (see README, "Unsigned builds").
appId: app.opennote.desktop
productName: OpenNote
copyright: Copyright © 2026 OpenNote contributors
artifactName: OpenNote-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

# Everything (main process, server and its dependencies) is bundled into dist/, so no node_modules are shipped.
files:
  - dist/**
  - package.json
extraResources:
  - from: ../web/dist
    to: web
asar: true

mac:
  category: public.app-category.productivity
  # Never pick a signing identity from the developer's keychain by accident. To sign and notarize a release build,
  # remove this line and provide CSC_NAME (or CSC_LINK/CSC_KEY_PASSWORD) and the APPLE_* notarization variables.
  identity: null
  extendInfo:
    NSMicrophoneUsageDescription: OpenNote uses the microphone only when you record an audio note.
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
dmg:
  title: OpenNote ${version}

linux:
  icon: build/icon.png
  executableName: opennote
  category: Office
  synopsis: Local-first notes
  description: OpenNote is a local-first, open source note-taking app. Your notes stay on this computer.
  maintainer: OpenNote contributors <opennote@users.noreply.github.com>
  target:
    - target: deb
      arch: [x64, arm64]
  desktop:
    entry:
      Name: OpenNote
      Comment: Local-first notes
      Categories: Office;Utility;
      Keywords: notes;notebook;evernote;markdown;
deb:
  packageCategory: editors
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2t64 | libasound2

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false # notes live in ~/.opennote, never touched by the uninstaller
