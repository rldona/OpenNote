name: Mobile

# Kotlin Multiplatform core and apps (mobile/), and the sync contract they share with the TypeScript apps
# (docs/SYNC-FORMAT.md). Runs only when something on either side of that contract changes.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'server/src/sync*.ts'
      - 'server/src/schema.ts'
      - 'server/src/store.ts'
      - 'server/scripts/make-sync-fixtures.ts'
      - 'server/test/fixtures/**'
      - 'server/test/sync-fixtures.test.ts'
      - 'docs/SYNC-FORMAT.md'
      - 'web/src/embed/**'
      - 'web/src/editorSchema.ts'
      - 'web/src/prosemirror.css'
      - 'web/src/AudioNode.ts'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'server/src/sync*.ts'
      - 'server/src/schema.ts'
      - 'server/src/store.ts'
      - 'server/scripts/make-sync-fixtures.ts'
      - 'server/test/fixtures/**'
      - 'server/test/sync-fixtures.test.ts'
      - 'docs/SYNC-FORMAT.md'
      - 'web/src/embed/**'
      - 'web/src/editorSchema.ts'
      - 'web/src/prosemirror.css'
      - 'web/src/AudioNode.ts'
      - '.github/workflows/mobile.yml'

jobs:
  # The shared Kotlin code on the JVM, then the TypeScript engine reading back the location the Kotlin tests wrote.
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Kotlin core tests (contract fixtures, store, sync, Google Drive)
        working-directory: mobile
        run: ./gradlew :shared:jvmTest
      - name: TypeScript reads what Kotlin wrote
        working-directory: server
        env:
          OPENNOTE_REQUIRE_KOTLIN_LOCATION: '1'
        run: npx vitest run test/sync-fixtures.test.ts

  android:
    runs-on: ubuntu-24.04
    needs: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:embed -w web
      - name: Build the Android app
        working-directory: mobile
        run: ./gradlew :androidApp:assembleDebug

  # macOS minutes are the expensive ones: the iOS job runs after the cheap core job has passed.
  ios:
    runs-on: macos-latest
    needs: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:embed -w web
      - name: Pick an iPhone simulator
        id: sim
        run: echo "name=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')" >> "$GITHUB_OUTPUT"
      - name: Kotlin core tests in the iOS simulator
        working-directory: mobile
        run: ./gradlew :shared:iosSimulatorArm64Test -PiosTestDevice="${{ steps.sim.outputs.name }}"
      - name: Build the iOS app for the simulator
        working-directory: mobile/iosApp
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project OpenNote.xcodeproj -scheme OpenNote -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
